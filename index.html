<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetTaxi & PetGo</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        .container { 
            background: rgba(255, 255, 255, 0.95); 
            padding: 30px 25px; 
            border-radius: 16px; 
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3); 
            width: 100%; 
            max-width: 400px; 
            border-top: 6px solid #ffcc00;
            text-align: center;
            position: relative;
        }
        /* ენების არჩევანი ზედა მარჯვენა კუთხეში */
        .lang-switcher {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 5px;
        }
        .lang-btn {
            background: #f0f0f0;
            border: 1px solid #ccc;
            padding: 4px 8px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .lang-btn.active, .lang-btn:hover {
            background: #0078d7;
            color: #fff;
            border-color: #0078d7;
        }
        .logo-container {
            margin-top: 15px;
            margin-bottom: 20px;
        }
        .logo-container img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            border: 2px solid #fff;
        }
        h2 { 
            color: #0078d7; 
            margin-bottom: 20px; 
            font-size: 22px;
        }
        .form-group { 
            margin-bottom: 15px; 
            text-align: left;
        }
        label { 
            display: block; 
            margin-bottom: 5px; 
            font-weight: bold; 
            color: #333; 
            font-size: 14px;
        }
        input, select { 
            width: 100%; 
            padding: 10px; 
            border: 1px solid #bce0fd; 
            border-radius: 8px; 
            box-sizing: border-box; 
            outline: none;
            transition: border-color 0.3s;
            background: #fff;
        }
        input:focus, select:focus {
            border-color: #0078d7;
        }
        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-top: 15px;
            margin-bottom: 20px;
            text-align: left;
        }
        .checkbox-group input {
            width: 20px;
            height: 20px;
            margin-top: 2px;
            accent-color: #0078d7;
            cursor: pointer;
        }
        .checkbox-group label {
            font-weight: normal;
            font-size: 13px;
            color: #555;
            line-height: 1.4;
            cursor: pointer;
        }
        button { 
            width: 100%; 
            background-color: #ffcc00; 
            color: #111; 
            border: none; 
            padding: 12px; 
            border-radius: 8px; 
            font-size: 16px; 
            cursor: pointer; 
            font-weight: bold; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: background-color 0.3s;
            margin-top: 5px;
        }
        button:hover { 
            background-color: #e6b800; 
        }
        /* PetGo მთავარი მენიუს ღილაკები */
        .petgo-main-btn {
            background-color: #0078d7;
            color: #fff;
            font-size: 18px;
            padding: 15px;
            border-radius: 12px;
            margin-top: 12px;
            box-shadow: 0 4px 15px rgba(0, 120, 215, 0.4);
        }
        .petgo-main-btn:hover {
            background-color: #005fa3;
        }
        .petgo-secondary-btn {
            background-color: #28a745;
            color: #fff;
            font-size: 18px;
            padding: 15px;
            border-radius: 12px;
            margin-top: 12px;
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.4);
        }
        .petgo-secondary-btn:hover {
            background-color: #218838;
        }
        .back-btn {
            background-color: #e4e6eb;
            color: #333;
            margin-bottom: 10px;
        }
        .back-btn:hover {
            background-color: #d8dadf;
        }
        .step { display: none; }
        .step.active { display: block; }
    </style>
</head>
<body>

<div class="container">
    <!-- ენების ღილაკები -->
    <div class="lang-switcher">
        <button class="lang-btn active" onclick="setLanguage('ka')">GE</button>
        <button class="lang-btn" onclick="setLanguage('en')">EN</button>
        <button class="lang-btn" onclick="setLanguage('ru')">RU</button>
    </div>

    <!-- მრგვალი ლოგო -->
    <div class="logo-container">
        <img src="logo.png" alt="PetTaxi Logo">
    </div>

    <!-- ნაბიჯი 1: ტელეფონის ნომერი -->
    <div id="step-phone" class="step active">
        <h2 data-key="title_login">PetTaxi - ში შესვლა</h2>
        <div class="form-group">
            <label data-key="label_phone">ტელეფონის ნომერი</label>
            <input type="tel" id="phone" placeholder="+995 5xx xx xx xx" required>
        </div>
        <button onclick="sendCode()" data-key="btn_send">კოდის გაგზავნა</button>
    </div>

    <!-- ნაბიჯი 2: SMS კოდის დადასტურება -->
    <div id="step-verify" class="step">
        <h2 data-key="title_login">PetTaxi - ში შესვლა</h2>
        <div class="form-group">
            <label data-key="label_code">სმს-ით მიღებული 4-ნიშნა კოდი</label>
            <input type="text" id="code" placeholder="1234" maxlength="4" required>
        </div>
        <button onclick="verifyCode()" data-key="btn_verify">დადასტურება</button>
        <button class="back-btn" onclick="goBackToPhone()" data-key="btn_back">← უკან დაბრუნება</button>
    </div>

    <!-- ნაბიჯი 3: პირადი და ცხოველის მონაცემები -->
    <div id="step-profile" class="step">
        <h2 data-key="title_profile">პროფილის შევსება</h2>
        <div class="form-group">
            <label data-key="label_fullname">სახელი და გვარი</label>
            <input type="text" id="fullname" placeholder="მაგ: გიორგი ბერიძე" required>
        </div>
        <div class="form-group">
            <label data-key="label_altphone">დამატებითი ტელეფონის ნომერი</label>
            <input type="tel" id="alt-phone" placeholder="+995 5xx xx xx xx">
        </div>
        <div class="form-group">
            <label data-key="label_address">მისამართი</label>
            <input type="text" id="address" placeholder="ქალაქი, ქუჩა, კორპუსი">
        </div>
        <hr style="margin: 15px 0; border: 0; border-top: 1px solid #e0effe;">
        <div class="form-group">
            <label data-key="label_pettype">ცხოველის ტიპი</label>
            <select id="pet-type">
                <option value="dog" data-key="opt_dog">ძაღლი</option>
                <option value="cat" data-key="opt_cat">კატა</option>
                <option value="other" data-key="opt_other">სხვა</option>
            </select>
        </div>
        <div class="form-group">
            <label data-key="label_petname">ცხოველის სახელი</label>
            <input type="text" id="pet-name" placeholder="მაგ: რექსი">
        </div>
        <div class="form-group">
            <label data-key="label_petweight">ცხოველის წონა (კგ)</label>
            <input type="number" id="pet-weight" placeholder="მაგ: 12">
        </div>
        <div class="form-group">
            <label data-key="label_petsize">ცხოველის ზომა</label>
            <select id="pet-size">
                <option value="small" data-key="opt_small">პატარა (< 10 კგ)</option>
                <option value="medium" data-key="opt_medium">საშუალო (10 - 25 კგ)</option>
                <option value="large" data-key="opt_large">დიდი (> 25 კგ)</option>
            </select>
        </div>

        <!-- თანხმობის ველი -->
        <div class="checkbox-group">
            <input type="checkbox" id="save-data-consent" required>
            <label for="save-data-consent" data-key="label_consent">ვეთანხმები, რომ PetTaxi-ს მომსახურების სერვისმა შეინახოს ჩემი და ცხოველის მონაცემები სამომავლო შეკვეთების გამარტივების მიზნით.</label>
        </div>

        <button onclick="completeRegistration()" data-key="btn_finish">რეგისტრაციის დასრულება</button>
    </div>

    <!-- ნაბიჯი 4: PetGo მთავარი მენიუ (ორი ღილაკით) -->
    <div id="step-petgo" class="step">
        <h2 data-key="title_petgo">მიიღეთ მომსახურება</h2>
        <p style="color: #666; font-size: 14px; margin-bottom: 20px;" data-key="subtitle_petgo">აირჩიეთ მომსახურების ტიპი</p>
        <button class="petgo-main-btn" onclick="openBookingScreen(false)" data-key="btn_petgo_now">PetGo (ახლავე გამოძახება)</button>
        <button class="petgo-secondary-btn" onclick="openBookingScreen(true)" data-key="btn_petgo_later">📅 დაჯავშნე სამომავლოდ</button>
    </div>

    <!-- ნაბიჯი 5: მისამართების და (სურვილისამებრ) თარიღის ჩასაწერი ფანჯარა -->
    <div id="step-booking" class="step">
        <h2 id="booking-title" data-key="title_booking">მგზავრობის დეტალები</h2>
        
        <!-- თარიღისა და საათის ველი (ჩნდება მხოლოდ ჯავშნისას) -->
        <div id="datetime-container" class="form-group" style="display: none;">
            <label data-key="label_datetime">🗓️ მიუთითეთ თარიღი და საათი</label>
            <input type="datetime-local" id="booking-datetime">
        </div>

        <div class="form-group">
            <label data-key="label_pickup">📍 საწყისი მისამართი (სად აიყვანონ)</label>
            <input type="text" id="pickup-address" placeholder="მაგ: რუსთაველის გამზირი 12">
        </div>
        <div class="form-group">
            <label data-key="label_destination">🏁 დანიშნულების ადგილი (სად მიჰყავთ)</label>
            <input type="text" id="destination-address" placeholder="მაგ: ვაკის პარკი">
        </div>
        <button onclick="submitOrder()" data-key="btn_order">მოთხოვნის გაგზავნა</button>
        <button class="back-btn" onclick="goBackToPetGo()" data-key="btn_back">← უკან</button>
    </div>
</div>

            label_pickup: "📍 საწყისი მისამართი (სად აყვანონ)",
            label_destination: "🏁 დანიშნულების ადგილი (სად მიჰყავთ)",

            err_phone: "გთხოვთ შეიყვანოთ სწორი ნომერი",
            err_code: "კოდი შედგება 4 ნიშნისგან",
            err_name: "გთხოვთ მიუთითოთ სახელი და გვარი",

            title_booking: "Детали поездки",

            label_pickup: "📍 Адрес отправления",
            label_destination: "🏁 Адрес назначения",
            btn_order: "Отправить запрос",
            err_phone: "Пожалуйста, введите правильный номер",
            err_code: "Код должен состоять из 4 цифр",
            err_name: "Пожалуйста, укажите имя и фамилию",
            err_consent: "Для сохранения данных необходимо согласие",
            err_addresses: "Пожалуйста, заполните все обязательные поля",
            success_order: "Заказ принят! Водитель скоро с вами свяжется."
        }
    };

    let currentLang = 'ka';
    let isBookingLater = false;

    function setLanguage(lang) {
        currentLang = lang;
        
        document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        document.querySelectorAll('[data-key]').forEach(el => {
            const key = el.getAttribute('data-key');
            if (translations[lang][key]) {
                el.innerText = translations[lang][key];
            }
        });
    }

    function sendCode() {
        const phone = document.getElementById('phone').value;
        if(phone.length < 9) {
            alert(translations[currentLang].err_phone);
            return;
        }
        document.getElementById('step-phone').classList.remove('active');
        document.getElementById('step-verify').classList.add('active');
    }

    function goBackToPhone() {
        document.getElementById('step-verify').classList.remove('active');
        document.getElementById('step-phone').classList.add('active');
    }

    function verifyCode() {
        const code = document.getElementById('code').value;
        if(code.length !== 4) {
            alert(translations[currentLang].err_code);
            return;
        }
        document.getElementById('step-verify').classList.remove('active');
        document.getElementById('step-profile').classList.add('active');
    }

    function completeRegistration() {
        const fullname = document.getElementById('fullname').value;
        const consent = document.getElementById('save-data-consent').checked;

        if(!fullname) {
            alert(translations[currentLang].err_name);
            return;
        }
        if(!consent) {
            alert(translations[currentLang].err_consent);
            return;
        }

        document.getElementById('step-profile').classList.remove('active');
        document.getElementById('step-petgo').classList.add('active');
    }

    // ფუნქცია ხსნის მისამართების ფანჯარას (თუ later=true, აჩვენებს თარიღის ველსაც)
    function openBookingScreen(later) {
        isBookingLater = later;
        const datetimeContainer = document.getElementById('datetime-container');
        const bookingTitle = document.getElementById('booking-title');

        if (later) {
            datetimeContainer.style.display = 'block';
            bookingTitle.innerText = translations[currentLang].title_booking_later;
        } else {
            datetimeContainer.style.display = 'none';
            bookingTitle.innerText = translations[currentLang].title_booking;
        }

        document.getElementById('step-petgo').classList.remove('active');
        document.getElementById('step-booking').classList.add('active');
    }

    function goBackToPetGo() {
        document.getElementById('step-booking').classList.remove('active');
        document.getElementById('step-petgo').classList.add('active');
    }

    function submitOrder() {
        const pickup = document.getElementById('pickup-address').value;
        const destination = document.getElementById('destination-address').value;
        const datetime = document.getElementById('booking-datetime').value;

        if(!pickup || !destination || (isBookingLater && !datetime)) {
            alert(translations[currentLang].err_addresses);
            return;
        }

        alert(translations[currentLang].success_order);
    }
</script>

</body>
</html>
