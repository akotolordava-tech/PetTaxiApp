<!DOCTYPE html>
<html lang="ka" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetTaxi & PetGo</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        .container { 
            background: rgba(255, 255, 255, 0.95); 
            padding: 30px 25px; 
            border-radius: 16px; 
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3); 
            width: 100%; 
            max-width: 400px; 
            border-top: 6px solid #ffcc00;
            text-align: center;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }
        /* ენების არჩევანი ზედა მარჯვენა კუთხეში */
        .lang-switcher {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 5px;
        }
        .lang-btn {
            background: #f0f0f0;
            border: 1px solid #ccc;
            padding: 4px 8px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .lang-btn.active, .lang-btn:hover {
            background: #0078d7;
            color: #fff;
            border-color: #0078d7;
        }
        .logo-container {
            margin-top: 15px;
            margin-bottom: 20px;
        }
        .logo-container img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            border: 2px solid #fff;
        }
        h2 { 
            color: #0078d7; 
            margin-bottom: 20px; 
            font-size: 22px;
        }
        .form-group { 
            margin-bottom: 15px; 
            text-align: left;
        }
        label { 
            display: block; 
            margin-bottom: 5px; 
            font-weight: bold; 
            color: #333; 
            font-size: 14px;
        }
        input, select { 
            width: 100%; 
            padding: 10px; 
            border: 1px solid #bce0fd; 
            border-radius: 8px; 
            box-sizing: border-box; 
            outline: none;
            transition: border-color 0.3s;
            background: #fff;
        }
        input:focus, select:focus {
            border-color: #0078d7;
        }
        
        /* რაოდენობების ამორჩევის სტილი (+ / -) */
        .counter-section {
            background: #f8fbff;
            border: 1px solid #d0e7ff;
            border-radius: 10px;
            padding: 12px 15px;
            margin-bottom: 15px;
            text-align: left;
        }
        .counter-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .counter-row:last-child {
            margin-bottom: 0;
        }
        .counter-label {
            font-size: 13px;
            font-weight: bold;
            color: #333;
        }
        .counter-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .counter-btn {
            width: 28px;
            height: 28px;
            background-color: #0078d7;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
            margin: 0;
        }
        .counter-btn:hover {
            background-color: #005fa3;
        }
        .counter-value {
            font-size: 14px;
            font-weight: bold;
            width: 20px;
            text-align: center;
            color: #333;
        }

        /* გადახდის მეთოდების სტილი */
        .payment-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 15px;
            margin-bottom: 20px;
        }
        .payment-card {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            border: 2px solid #bce0fd;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            background: #f8fbff;
            text-align: left;
        }
        .payment-card:hover {
            border-color: #0078d7;
            background: #f0f7ff;
        }
        .payment-card input[type="radio"] {
            width: 20px;
            height: 20px;
            accent-color: #0078d7;
        }
        .payment-info span.title {
            font-weight: bold;
            font-size: 16px;
            color: #333;
            display: block;
        }
        .payment-info span.desc {
            font-size: 12px;
            color: #666;
        }

        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-top: 15px;
            margin-bottom: 20px;
            text-align: left;
        }
        .checkbox-group input {
            width: 20px;
            height: 20px;
            margin-top: 2px;
            accent-color: #0078d7;
            cursor: pointer;
        }
        .checkbox-group label {
            font-weight: normal;
            font-size: 13px;
            color: #555;
            line-height: 1.4;
            cursor: pointer;
        }
        button { 
            width: 100%; 
            background-color: #ffcc00; 
            color: #111; 
            border: none; 
            padding: 12px; 
            border-radius: 8px; 
            font-size: 16px; 
            cursor: pointer; 
            font-weight: bold; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: background-color 0.3s;
            margin-top: 5px;
        }
        button:hover { 
            background-color: #e6b800; 
        }
        .petgo-main-btn {
            background-color: #0078d7;
            color: #fff;
            font-size: 18px;
            padding: 15px;
            border-radius: 12px;
            margin-top: 12px;
            box-shadow: 0 4px 15px rgba(0, 120, 215, 0.4);
        }
        .petgo-main-btn:hover {
            background-color: #005fa3;
        }
        .petgo-secondary-btn {
            background-color: #28a745;
            color: #fff;
            font-size: 18px;
            padding: 15px;
            border-radius: 12px;
            margin-top: 12px;
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.4);
        }
        .petgo-secondary-btn:hover {
            background-color: #218838;
        }
        .back-btn {
            background-color: #e4e6eb;
            color: #333;
            margin-bottom: 10px;
        }
        .back-btn:hover {
            background-color: #d8dadf;
        }
        .call-btn {
            background-color: #28a745;
            color: white;
            font-size: 16px;
            margin-top: 15px;
        }
        .call-btn:hover {
            background-color: #218838;
        }
        .step { display: none; }
        .step.active { display: block; }
        
        #price-display {
            margin-top: 15px;
            padding: 12px;
            background: #eef2f3;
            border-radius: 8px;
            text-align: center;
            font-size: 16px;
            color: #2c3e50;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- ენების ღილაკები -->
    <div class="lang-switcher">
        <button class="lang-btn active" onclick="setLanguage('ka')">GE</button>
        <button class="lang-btn" onclick="setLanguage('en')">EN</button>
        <button class="lang-btn" onclick="setLanguage('ru')">RU</button>
    </div>

    <!-- მრგვალი ლოგო -->
    <div class="logo-container">
        <img src="logo.png" alt="PetTaxi Logo">
    </div>

    <!-- ნაბიჯი 1: ტელეფონის ნომერი -->
    <div id="step-phone" class="step active">
        <h2 data-key="title_login">PetTaxi - ში შესვლა</h2>
        <div class="form-group">
            <label data-key="label_phone">ტელეფონის ნომერი</label>
            <input type="tel" id="phone" placeholder="+995 5xx xx xx xx" required>
        </div>
        <button onclick="sendCode()" data-key="btn_send">კოდის გაგზავნა</button>
    </div>

    <!-- ნაბიჯი 2: SMS კოდის დადასტურება -->
    <div id="step-verify" class="step">
        <h2 data-key="title_login">PetTaxi - ში შესვლა</h2>
        <div class="form-group">
            <label data-key="label_code">სმს-ით მიღებული 4-ნიშნა კოდი</label>
            <input type="text" id="code" placeholder="1234" maxlength="4" required>
        </div>
        <button onclick="verifyCode()" data-key="btn_verify">დადასტურება</button>
        <button class="back-btn" onclick="goBackToPhone()" data-key="btn_back">← უკან დაბრუნება</button>
    </div>

    <!-- ნაბიჯი 3: პირადი, ცხოველის და რაოდენობების მონაცემები -->
    <div id="step-profile" class="step">
        <h2 data-key="title_profile">პროფილის შევსება</h2>
        <div class="form-group">
            <label data-key="label_fullname">სახელი და გვარი</label>
            <input type="text" id="fullname" placeholder="მაგ: გიორგი ბერიძე" required>
        </div>
        <div class="form-group">
            <label data-key="label_altphone">დამატებითი ტელეფონის ნომერი</label>
            <input type="tel" id="alt-phone" placeholder="+995 5xx xx xx xx">
        </div>
        <div class="form-group">
            <label data-key="label_address">მისამართი</label>
            <input type="text" id="address" placeholder="ქალაქი, ქუჩა, კორპუსი">
        </div>
        
        <!-- მგზავრების, ცხოველების და ბარგის რაოდენობის ბლოკი -->
        <label data-key="label_counts_title" style="margin-bottom: 8px;">მგზავრების და ტვირთის რაოდენობა</label>
        <div class="counter-section">
            <div class="counter-row">
                <span class="counter-label" data-key="count_human">👤 ადამიანი</span>
                <div class="counter-controls">
                    <button class="counter-btn" onclick="updateCount('human', -1)">-</button>
                    <span id="count-human-val" class="counter-value">1</span>
                    <button class="counter-btn" onclick="updateCount('human', 1)">+</button>
                </div>
            </div>
            <hr style="margin: 8px 0; border: 0; border-top: 1px solid #e0effe;">
            <div class="counter-row">
                <span class="counter-label" data-key="count_pet">🐾 ცხოველი</span>
                <div class="counter-controls">
                    <button class="counter-btn" onclick="updateCount('pet', -1)">-</button>
                    <span id="count-pet-val" class="counter-value">1</span>
                    <button class="counter-btn" onclick="updateCount('pet', 1)">+</button>
                </div>
            </div>
            <hr style="margin: 8px 0; border: 0; border-top: 1px solid #e0effe;">
            <div class="counter-row">
                <span class="counter-label" data-key="count_luggage">🧳 ბარგი</span>
                <div class="counter-controls">
                    <button class="counter-btn" onclick="updateCount('luggage', -1)">-</button>
                    <span id="count-luggage-val" class="counter-value">0</span>
                    <button class="counter-btn" onclick="updateCount('luggage', 1)">+</button>
                </div>
            </div>
        </div>

        <hr style="margin: 15px 0; border: 0; border-top: 1px solid #e0effe;">
        <div class="form-group">
            <label data-key="label_pettype">ცხოველის ტიპი</label>
            <select id="pet-type">
                <option value="dog" data-key="opt_dog">ძაღლი</option>
                <option value="cat" data-key="opt_cat">კატა</option>
                <option value="other" data-key="opt_other">სხვა</option>
            </select>
        </div>
        <div class="form-group">
            <label data-key="label_petname">ცხოველის სახელი</label>
            <input type="text" id="pet-name" placeholder="მაგ: რექსი">
        </div>
        <div class="form-group">
            <label data-key="label_petweight">ცხოველის წონა (კგ)</label>
            <input type="number" id="pet-weight" placeholder="მაგ: 12">
        </div>
        <div class="form-group">
            <label data-key="label_petsize">ცხოველის ზომა</label>
            <select id="pet-size">
                <option value="small" data-key="opt_small">პატარა (< 10 კგ)</option>
                <option value="medium" data-key="opt_medium">საშუალო (10 - 25 კგ)</option>
                <option value="large" data-key="opt_large">დიდი (> 25 კგ)</option>
            </select>
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="save-data-consent" required>
            <label for="save-data-consent" data-key="label_consent">ვეთანხმები, რომ PetTaxi-ს მომსახურების სერვისმა შეინახოს ჩემი და ცხოველის მონაცემები სამომავლო შეკვეთების გამარტივების მიზნით.</label>
        </div>

        <button onclick="completeRegistration()" data-key="btn_finish">რეგისტრაციის დასრულება</button>
    </div>

    <!-- ნაბიჯი 4: PetGo მთავარი მენიუ -->
    <div id="step-petgo" class="step">
        <h2 data-key="title_petgo">მიიღეთ მომსახურება</h2>
        <p style="color: #666; font-size: 14px; margin-bottom: 20px;" data-key="subtitle_petgo">აირჩიეთ მომსახურების ტიპი</p>
        <button class="petgo-main-btn" onclick="openBookingScreen(false)" data-key="btn_petgo_now">PetGo (ახლავე გამოძახება)</button>
        <button class="petgo-secondary-btn" onclick="openBookingScreen(true)" data-key="btn_petgo_later">📅 დაჯავშნე სამომავლოდ</button>
    </div>

    <!-- ნაბიჯი 5: მისამართების არჩევა და ფასის ჩვენება -->
    <div id="step-booking" class="step">
        <h2 id="booking-title" data-key="title_booking">მგზავრობის დეტალები</h2>
        
        <div id="datetime-container" class="form-group" style="display: none;">
            <label data-key="label_datetime">🗓️ მიუთითეთ თარიღი და საათი</label>
            <input type="datetime-local" id="booking-datetime">
        </div>

        <div class="form-group">
            <label data-key="label_pickup">📍 საწყისი მისამართი</label>
            <select id="startAddress" onchange="checkAndCalculatePrice()">
                <option value="" disabled selected data-key="opt_select_start">აირჩიეთ საწყისი მისამართი</option>
                <option value="ტარიელის ქუჩა 10ბ">ტარიელის ქუჩა 10ბ</option>
                <option value="ნიკოლოზ ყიფშიძის 17">ნიკოლოზ ყიფშიძის 17</option>
                <option value="ცინცაძის 49">ცინცაძის 49</option>
                <option value="დანელიას 2">დანელიას 2</option>
                <option value="გოგებაშვილის 44">გოგებაშვილის 44</option>
            </select>
        </div>
        
        <div class="form-group">
            <label data-key="label_destination">🏁 დანიშნულების ადგილი</label>
            <select id="endAddress" onchange="checkAndCalculatePrice()">
                <option value="" disabled selected data-key="opt_select_end">აირჩიეთ დანიშნულების მისამართი</option>
                <option value="ვასო გოძიაშვილის ქუჩა 13">ვასო გოძიაშვილის ქუჩა 13</option>
                <option value="ევგენ გვალაძის 22">ევგენ გვალაძის 22</option>
                <option value="ნოდარ დუმბაძის გამზირი 66">ნოდარ დუმბაძის გამზირი 66</option>
                <option value="ჟიული შარტავას 19">ჟიული შარტავას 19</option>
                <option value="მერაბ კოსტავას 3">მერაბ კოსტავას 3</option>
            </select>
        </div>

        <div id="price-display">
            <div id="price-text" style="margin-bottom: 10px;"></div>
            <button class="call-btn" onclick="proceedToPayment()" data-key="btn_call">გამოძახება</button>
        </div>

        <button class="back-btn" onclick="goBackToPetGo()" data-key="btn_back" style="margin-top: 15px;">← უკან</button>
    </div>

    <!-- ნაბიჯი 6: გადახდის მეთოდის არჩევა -->
    <div id="step-payment" class="step">
        <h2 data-key="title_payment">გადახდის მეთოდი</h2>
        <p style="color: #666; font-size: 14px; margin-bottom: 15px;" id="payment-amount-summary"></p>
        
        <div class="payment-options">
            <label class="payment-card">
                <input type="radio" name="payment-method" value="cash" checked>
                <div class="payment-info">
                    <span class="title" data-key="pay_cash">💵 ქეში (ნაღდი ფულით)</span>
                    <span class="desc" data-key="pay_cash_desc">გადახდა მძღოლთან ადგილზე</span>
                </div>
            </label>
            
            <label class="payment-card">
                <input type="radio" name="payment-method" value="card">
                <div class="payment-info">
                    <span class="title" data-key="pay_card">💳 ბარათით გადახდა</span>
                    <span class="desc" data-key="pay_card_desc">ონლაინ გადახდა ბარათით</span>
                </div>
            </label>
        </div>

        <button class="call-btn" onclick="confirmOrder()" data-key="btn_confirm_payment">დადასტურება და გამოძახება</button>
        <button class="back-btn" onclick="goBackToBooking()" data-key="btn_back" style="margin-top: 10px;">← უკან</button>
    </div>
</div>

<script>
    const translations = {
        ka: {
            title_login: "PetTaxi - ში შესვლა",
            label_phone: "ტელეფონის ნომერი",
            btn_send: "კოდის გაგზავნა",
            label_code: "სმს-ით მიღებული 4-ნიშნა კოდი",
            btn_verify: "დადასტურება",
            btn_back: "← უკან დაბრუნება",
            title_profile: "პროფილის შევსება",
            label_fullname: "სახელი და გვარი",
            label_altphone: "დამატებითი ტელეფონის ნომერი",
            label_address: "მისამართი",
            label_counts_title: "მგზავრების და ტვირთის რაოდენობა",
            count_human: "👤 ადამიანი",
            count_pet: "🐾 ცხოველი",
            count_luggage: "🧳 ბარგი",
            label_pettype: "ცხოველის ტიპი",
            opt_dog: "ძაღლი",
            opt_cat: "კატა",
            opt_other: "სხვა",
            label_petname: "ცხოველის სახელი",
            label_petweight: "ცხოველის წონა (კგ)",
            label_petsize: "ცხოველის ზომა",
            opt_small: "პატარა (< 10 კგ)",
            opt_medium: "საშუალო (10 - 25 კგ)",
            opt_large: "დიდი (> 25 კგ)",
            label_consent: "ვეთანხმები, რომ PetTaxi-ს მომსახურების სერვისმა შეინახოს ჩემი და ცხოველის მონაცემები სამომავლო შეკვეთების გამარტივების მიზნით.",
            btn_finish: "რეგისტრაციის დასრულება",
            title_petgo: "მიიღეთ მომსახურება",

    let currentLang = 'ka';
    let isBookingLater = false;
    let calculatedPrice = 0;

    let counts = {
        human: 1,
        pet: 1,
        luggage: 0
    };

    function updateCount(type, change) {
        counts[type] += change;
        if (type === 'human' && counts.human < 1) counts.human = 1;
        if (type === 'pet' && counts.pet < 1) counts.pet = 1;
        if (type === 'luggage' && counts.luggage < 0) counts.luggage = 0;

        document.getElementById(`count-${type}-val`).innerText = counts[type];
    }

    function setLanguage(lang) {
        currentLang = lang;
        document.getElementById('html-root').setAttribute('lang', lang);
        
        document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
        
        // ვპოულობთ და ვააქტიურებთ იმ ღილაკს, რომელსაც დააკლიკა მომხმარებელმა
        event.target.classList.add('active');

        // ვცვლით ყველა ტექსტს საიტზე დინამკურად
        document.querySelectorAll('[data-key]').forEach(el => {
            const key = el.getAttribute('data-key');
            if (translations[lang][key]) {
                el.innerText = translations[lang][key];
            }
        });

        // დინამიური სათაურების განახლება
        if(document.getElementById('step-booking').classList.contains('active')) {
            document.getElementById('booking-title').innerText = isBookingLater ? translations[lang].title_booking_later : translations[lang].title_booking;
        }
        
        // თუ ფასი უკვე გამოთვლილია, ენის შეცვლისას ფასის წარწერაც განახლდეს
        const start = document.getElementById('startAddress').value;
        const end = document.getElementById('endAddress').value;
        if (start && end) {
            document.getElementById('price-text').innerHTML = `${translations[currentLang].price_label}<strong>${calculatedPrice} ლარი</strong>`;
        }
    }

    function sendCode() {
        const phone = document.getElementById('phone').value;
        if(phone.length < 9) {
            alert(translations[currentLang].err_phone);
            return;
        }
        document.getElementById('step-phone').classList.remove('active');
        document.getElementById('step-verify').classList.add('active');
    }

    function goBackToPhone() {
        document.getElementById('step-verify').classList.remove('active');
        document.getElementById('step-phone').classList.add('active');
    }

    function verifyCode() {
        const code = document.getElementById('code').value;
        if(code.length !== 4) {
            alert(translations[currentLang].err_code);
            return;
        }
        document.getElementById('step-verify').classList.remove('active');
        document.getElementById('step-profile').classList.add('active');
    }

    function completeRegistration() {
        const fullname = document.getElementById('fullname').value;
        const consent = document.getElementById('save-data-consent').checked;

        if(!fullname) {
            alert(translations[currentLang].err_name);
            return;
        }
        if(!consent) {
            alert(translations[currentLang].err_consent);
            return;
        }

        document.getElementById('step-profile').classList.remove('active');
        document.getElementById('step-petgo').classList.add('active');
    }

    function openBookingScreen(later) {
        isBookingLater = later;
        const datetimeContainer = document.getElementById('datetime-container');
        const bookingTitle = document.getElementById('booking-title');
        
        document.getElementById('startAddress').selectedIndex = 0;
        document.getElementById('endAddress').selectedIndex = 0;
        document.getElementById('price-display').style.display = 'none';

        if (later) {
            datetimeContainer.style.display = 'block';
            bookingTitle.innerText = translations[currentLang].title_booking_later;
        } else {
            datetimeContainer.style.display = 'none';
            bookingTitle.innerText = translations[currentLang].title_booking;
        }

        document.getElementById('step-petgo').classList.remove('active');
        document.getElementById('step-booking').classList.add('active');
    }

    function goBackToPetGo() {
        document.getElementById('step-booking').classList.remove('active');
        document.getElementById('step-petgo').classList.add('active');
    }

    function checkAndCalculatePrice() {
        const start = document.getElementById('startAddress').value;
        const end = document.getElementById('endAddress').value;
        const datetime = document.getElementById('booking-datetime').value;
        const priceDisplay = document.getElementById('price-display');
        const priceText = document.getElementById('price-text');

        if (start && end && (!isBookingLater || datetime)) {
            const prices = [25, 30, 48, 54, 23];
            let randomPrice = prices[Math.floor(Math.random() * prices.length)];
            
            randomPrice += (counts.human - 1) * 5 + (counts.luggage * 3);
            calculatedPrice = randomPrice;

            priceText.innerHTML = `${translations[currentLang].price_label}<strong>${calculatedPrice} ლარი</strong>`;
            priceDisplay.style.display = 'block';
        } else if (isBookingLater && start && end && !datetime) {
            alert(translations[currentLang].err_datetime);
        }
    }

    function proceedToPayment() {
        document.getElementById('payment-amount-summary').innerHTML = `${translations[currentLang].price_label}<b>${calculatedPrice} ლარი</b>`;
        document.getElementById('step-booking').classList.remove('active');
        document.getElementById('step-payment').classList.add('active');
    }

    function goBackToBooking() {
        document.getElementById('step-payment').classList.remove('active');
        document.getElementById('step-booking').classList.add('active');
    }

    function confirmOrder() {
        alert(translations[currentLang].success_call);
        openBookingScreen(isBookingLater);
    }
</script>
